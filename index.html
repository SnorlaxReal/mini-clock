<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    overflow: hidden;
  }
  #clock {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font: 700 min(19vw, 90vh)/1 monospace;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<div id="clock"></div>
<script>
  const clock = document.getElementById('clock');
  function tick() {
    clock.textContent = new Date().toLocaleTimeString('en-GB');
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
